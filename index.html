<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="description" content="Suivi de scolarité BUT1 Informatique : notes et moyennes, emploi du temps, devoirs et évaluations.">
    <title>BUT1 Informatique - Gestionnaire de Notes</title>

    <!-- iOS & PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Notes BUT1">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <!-- Styles servis localement (Tailwind compilé, Font Awesome, Inter) : fonctionne hors-ligne -->
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[60] focus:bg-brand-600 focus:text-white focus:px-3 focus:py-2 focus:rounded-lg">Aller au contenu</a>

    <div class="lg:flex min-h-screen">
        <!-- Barre latérale (desktop) -->
        <aside id="sidebar" class="hidden lg:flex lg:flex-col w-64 shrink-0 bg-slate-900 border-r border-slate-800 sticky top-0 h-screen safe-top" aria-label="Navigation principale">
            <div class="flex items-center space-x-3 px-5 h-16 border-b border-slate-800">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-brand-600/30">
                    <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                </div>
                <div>
                    <p class="font-bold text-lg tracking-tight text-white leading-tight">BUT1 Informatique</p>
                    <p class="text-xs text-slate-400">Suivi de scolarité S1</p>
                </div>
            </div>
            <nav id="sidebar-nav" class="flex-1 p-3 space-y-1"></nav>
            <div id="sidebar-sync" class="p-4 border-t border-slate-800"></div>
        </aside>

        <div class="flex-1 min-w-0 flex flex-col min-h-screen">
            <!-- En-tête -->
            <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md backdrop-blur-md bg-opacity-90 safe-top">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
                    <div class="flex items-center space-x-3 min-w-0">
                        <div class="lg:hidden w-10 h-10 shrink-0 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-brand-600/30">
                            <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                        </div>
                        <div class="min-w-0">
                            <h1 id="page-title" class="font-bold text-lg tracking-tight text-white leading-tight truncate">Aujourd'hui</h1>
                            <p class="text-xs text-slate-400 lg:hidden">BUT1 Informatique · S1</p>
                        </div>
                    </div>
                    <div id="header-sync" class="shrink-0 lg:hidden"></div>
                </div>
            </header>

            <main id="main" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 main-bottom-space" tabindex="-1">
                <section data-page="accueil" aria-label="Accueil"></section>
                <section data-page="notes" aria-label="Notes" hidden></section>
                <section data-page="edt" aria-label="Emploi du temps" hidden></section>
                <section data-page="devoirs" aria-label="Devoirs" hidden></section>
                <section data-page="reglages" aria-label="Réglages" hidden></section>
                <noscript>
                    <p class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-sm">Cette application nécessite JavaScript.</p>
                </noscript>
            </main>
        </div>
    </div>

    <!-- Barre d'onglets (mobile) -->
    <nav id="tabbar" class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 safe-bottom" aria-label="Navigation principale">
        <div id="tabbar-items" class="flex items-stretch max-w-lg mx-auto"></div>
    </nav>

    <div id="modal-root"></div>
    <div id="tooltip-layer"></div>
    <!-- Notifications -->
    <div id="toast-container" class="toast-area fixed right-4 z-50 space-y-2 pointer-events-none flex flex-col items-end" aria-live="polite"></div>
</body>
</html>
